name: menu

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The rebuild is the point: a pack must be the same bytes on any machine, so a diff here means either the
      # committed menu is stale or the archive is not reproducible. Modes are normalised for exactly this.
      - name: Validate the packs and the generated menu
        run: |
          python3 tools/build.py
          python3 tools/build.py --check
          git diff --exit-code -- MENU.md INDEX.json dist
